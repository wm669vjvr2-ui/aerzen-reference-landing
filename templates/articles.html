{% extends 'base.html' %}{% from '_macros.html' import arrow with context %}
{% block content %}<div class="breadcrumb wrap"><a href="/">Главная</a><span>/</span><span>Статьи</span></div><section class="text-hero wrap"><span class="eyebrow">Полезные материалы</span><h1>Понимать.<br>Выбирать точно.</h1></section><section class="section-pad article-grid">{% for item in articles %}<a class="article-card" href="/articles/{{ item.slug }}"><div class="article-photo"><img src="{{ item.image }}" alt="" width="800" height="600" loading="lazy"></div><span class="eyebrow">{{ item.category }}</span><h2>{{ item.title }}</h2><p>{{ item.summary }}</p><span class="link-arrow">Читать статью {{ arrow() }}</span></a>{% endfor %}</section>{% endblock %}
